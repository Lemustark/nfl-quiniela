{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card card-match p-4 shadow">
            <h3 class="text-center fw-bold mb-4">Iniciar Sesión</h3>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Usuario</label>
                    <input type="text" name="username" class="form-control bg-dark text-white border-secondary" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Contraseña</label>
                    <input type="password" name="password" class="form-control bg-dark text-white border-secondary" required>
                </div>
                <button type="submit" class="btn btn-nfl w-100 py-2 mt-2">Entrar</button>
            </form>
            <div class="text-center mt-3">
                <small class="text-muted">¿No tienes cuenta? <a href="{{ url_for('register') }}" class="text-info">Regístrate aquí</a></small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
